name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coursehub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coursehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 5432
      E2E_DB_NAME: coursehub_test
      E2E_DB_USER: postgres
      E2E_DB_PASSWORD: e2e_test_password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run static analysis
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build
